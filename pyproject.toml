[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnlpbench-r"
version = "0.2.0"
description = "Registered audit of apparent quantum feature-circuit gains on synthetic compositional language tasks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Subhojit Halder"},
  {name = "Srinjoy Ganguly"},
  {name = "Shalini Devendrababu"}
]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "tabulate==0.10.0",
  "pyyaml==6.0.3",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.9",
  "torch==2.12.0",
  "tqdm==4.67.3",
  "psutil==7.2.2"
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
