experiment:
  name: qnlpbench_r_stage6d_latent_d4_margin010_replication
  run_group: stage6d_replication
  description: Ten-seed focused replication on the calibrated latent-compositional regime selected after Stage 6C.
seed_list: [11, 23, 37, 41, 53, 67, 79, 83, 97, 109]
device: {preference: auto, require_cuda: false}
dataset:
  name: latent_compositional_semantics
  n_samples: 1800
  semantic_seed: 314159
  latent_dim: 4
  feature_set: primitive_slot_sequence
  validation_fraction: 0.15
  test_fraction: 0.20
  ood_composition_fraction: 0.10
  ood_depth_fraction: 0.10
  max_modifiers: 4
  ood_depth_min: 3
  min_abs_margin: 0.10
  label_noise: 0.0
  unique_examples: true
models: [{name: majority, type: majority}]
training:
  max_epochs: 80
  batch_size: 128
  learning_rate: 0.003
  weight_decay: 0.0001
  early_stopping_patience: 12
  gradient_clip_norm: 1.0
  mixed_precision: false
  num_workers: 0
  gradient_accumulation_steps: 1
evaluation:
  batch_size: 256
  splits: [train, val, test, ood, ood_composition, ood_depth]
  bootstrap_samples: 1000
  quantum_metrics: true
  kernel_sampling_strategy: stratified
  kernel_sample_cap: 256
  robustness: {enabled: false, variants: [], severities: [], shots: []}
output: {base_dir: results/stage6d/runs, save_checkpoints: true, continue_on_error: false}
logging: {level: INFO}
reproducibility: {deterministic_torch: true, save_environment: true}
